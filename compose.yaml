services:
  app:
    build: .
    image: quotes:local
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: ${APP_DATABASE_URL:-postgres://${POSTGRES_USER:-quotes}:${POSTGRES_PASSWORD:-quotes_local}@postgres:5432/${POSTGRES_DB:-quotes}?sslmode=disable}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-15s}
      HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-5s}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-10s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-10s}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-10}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-30m}
      DB_CONN_MAX_IDLE_TIME: ${DB_CONN_MAX_IDLE_TIME:-5m}
      DB_OPERATION_TIMEOUT: ${DB_OPERATION_TIMEOUT:-2s}
      WORKER_COUNT: ${WORKER_COUNT:-5}
      QUEUE_POLL_INTERVAL: ${QUEUE_POLL_INTERVAL:-500ms}
      QUEUE_MAX_PENDING: ${QUEUE_MAX_PENDING:-1000}
      JOB_LEASE_DURATION: ${JOB_LEASE_DURATION:-30s}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      JOB_RETRY_BASE_DELAY: ${JOB_RETRY_BASE_DELAY:-1s}
      RECOVERY_INTERVAL: ${RECOVERY_INTERVAL:-1s}
      PROVIDER_BASE_URL: ${PROVIDER_BASE_URL:-https://api.frankfurter.dev/v2/providers/ecb}
      PROVIDER_HTTP_TIMEOUT: ${PROVIDER_HTTP_TIMEOUT:-5s}
      PROVIDER_REQUESTS_PER_SECOND: ${PROVIDER_REQUESTS_PER_SECOND:-2}
      PROVIDER_CIRCUIT_FAILURE_THRESHOLD: ${PROVIDER_CIRCUIT_FAILURE_THRESHOLD:-5}
      PROVIDER_CIRCUIT_OPEN_DURATION: ${PROVIDER_CIRCUIT_OPEN_DURATION:-30s}
    # Add a small fixed allowance outside the application's shared drain budget.
    # Override together with SHUTDOWN_TIMEOUT if a longer drain is configured.
    stop_grace_period: ${CONTAINER_STOP_GRACE_PERIOD:-20s}

  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quotes}
      POSTGRES_USER: ${POSTGRES_USER:-quotes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quotes_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  migrate:
    image: migrate/migrate:v4.18.3
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGUSER: ${POSTGRES_USER:-quotes}
      PGPASSWORD: ${POSTGRES_PASSWORD:-quotes_local}
    volumes:
      - ./migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://postgres:5432/${POSTGRES_DB:-quotes}?sslmode=disable
    command: ["up"]

volumes:
  postgres_data:
